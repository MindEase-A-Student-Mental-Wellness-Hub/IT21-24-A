<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Welcome Screen -->
    <div id="welcome" class="page">
        <h1>Welcome to MindEase</h1>
        <button onclick="showPage('mainMenu')">Proceed</button>
    </div>

    <!-- Main Menu -->
    <div id="mainMenu" class="page hidden">
        <h2>MindEase Dashboard</h2>
        <button onclick="showPage('entryPage')">Create Entry</button>
        <button onclick="showPage('summaryPage')">Summary</button>
    </div>

    <!-- Entry Page -->
    <div id="entryPage" class="page hidden">
        <h2>New Journal Entry</h2>

        <label>Choose Subject:</label>
        <select id="subjectSelect">
            <option value="Objected Orriented Programming">Objected Orriented Programming</option>
            <option value="Event Driven">Event Driven</option>
            <option value="Fundamentals of Networking">Fundamentals of Networking</option>
            <option value="Contemporary World">Contemporary World</option>
            
        </select>

        <h3>Select Your Mood</h3>
        <div class="emojis" id="moodOptions">
            <span class="mood" data-mood="Happy">😊</span>
            <span class="mood" data-mood="Sad">😢</span>
            <span class="mood" data-mood="Angry">😡</span>
            <span class="mood" data-mood="Sick">🤒</span>
            <span class="mood" data-mood="Scared">😨</span>
            <span class="mood" data-mood="Tired">😴</span>
        </div>

        <p id="selectedMood"></p>

        <textarea id="thoughtText" placeholder="Write your thoughts…"></textarea>
        <br><br>

        <button onclick="saveEntry()">Save Entry</button>
        <button onclick="showPage('mainMenu')">Back</button>
    </div>

    <!-- Summary Dashboard -->
    <div id="summaryPage" class="page hidden">
        <h2>Your Progress Summary</h2>

        <table id="summaryTable">
            <tr>
                <th>Subject</th>
                <th>Mood</th>
                <th>Thoughts</th>
                <th>Motivational Quote</th>
                <th>Date</th>
            </tr>
        </table>

        <button onclick="showPage('mainMenu')">Back</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
